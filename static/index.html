<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SECLAB portal</title>
<link rel="stylesheet" href="/static/hud.css">
<style>
  .card h2 { margin-bottom: 8px; }
  .card .desc { margin: 0 0 12px; min-height: 4.2em; }
  .card .meta { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .card .actions { gap: 8px; }
  a.btn { text-decoration: none; }
  a.btn.disabled { opacity: 0.45; pointer-events: none; }
  .intro { margin: 0 0 14px; font-size: 12px; }
</style>
</head>
<body>
<header class="hud">
  <span class="brand">SECLAB</span>
  <span class="sub">lab portal on 127.0.0.1:8100, refreshes every 5 s</span>
  <nav><button id="refresh" type="button">Refresh</button></nav>
</header>
<main>
  <p class="intro muted">Each project runs on its own localhost port. Start and stop call the seclab script; Open is only live while the project answers its health check.</p>
  <div class="grid" id="cards">
    <p class="muted span-12">Checking projects...</p>
  </div>
</main>
<script src="/static/hud.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
